<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FluentFlow — Learn a Language Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1c1f2e; --sub:#6b7080; --line:#e7e8ef;
  --accent:#58cc02; --accent2:#1cb0f6; --accent-dark:#3d9c00; --gold:#ffc800;
  --radius:18px; --shadow:0 8px 24px rgba(20,20,40,.08);
  font-family:'Inter',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#12131c; --card:#1b1d2b; --ink:#f1f2f8; --sub:#9497ab; --line:#2a2c3d; } }
:root[data-theme="dark"]{ --bg:#12131c; --card:#1b1d2b; --ink:#f1f2f8; --sub:#9497ab; --line:#2a2c3d; }
:root[data-lang="neutral"]{ --accent:#6d5ce8; --accent2:#00b4a6; --accent-dark:#4b3bb0; --gold:#ffd166; }
:root[data-lang="zh"]{ --accent:#de2910; --accent2:#c9a13b; --accent-dark:#a31f0c; --gold:#ffd200; }
:root[data-lang="de"]{ --accent:#222222; --accent2:#dd0000; --accent-dark:#000000; --gold:#ffce00; }
:root[data-lang="es"]{ --accent:#f1a208; --accent2:#c60b1e; --accent-dark:#c47f00; --gold:#ffcd00; }
:root[data-lang="en"]{ --accent:#00247d; --accent2:#cf142b; --accent-dark:#001a5c; --gold:#f0f0f0; }
:root[data-lang="fr"]{ --accent:#0055a4; --accent2:#ef4135; --accent-dark:#003b73; --gold:#8a8f9e; }

*{box-sizing:border-box;}
html,body{margin:0;color:var(--ink);height:100%;}
body{
  transition:background .5s;
  background:
    radial-gradient(circle at 12% -6%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 52%),
    radial-gradient(circle at 100% 12%, color-mix(in srgb, var(--accent2) 16%, transparent), transparent 50%),
    radial-gradient(circle at 6% 78%, color-mix(in srgb, var(--accent2) 12%, transparent), transparent 46%),
    radial-gradient(circle at 96% 92%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 46%),
    var(--bg);
  background-attachment:fixed;
}
img,svg{max-width:100%;}
.bgMotif{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.bgMotif span{position:absolute;opacity:.16;filter:saturate(1.15);animation:motifFloat 6.5s ease-in-out infinite;}
@keyframes motifFloat{0%,100%{transform:translateY(0) rotate(var(--r,0deg));}50%{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 6deg));}}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px;position:relative;z-index:1;}
h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0 0 6px;}
button{font-family:inherit;cursor:pointer;}
.hide{display:none !important;}
a{color:var(--accent2);}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.authScreen{max-width:420px;margin:0 auto;padding:36px 18px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1;animation:rise .35s ease both;}
.logoRow{text-align:center;margin-bottom:22px;}
.logoRow h1{font-size:30px;margin-top:8px;}
.motto{color:var(--sub);font-size:14px;margin-top:-4px;}
.authCard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
.field input{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--bg);color:var(--ink);font-family:inherit;}
.field input:focus{outline:none;border-color:var(--accent);}
.pwHint{font-size:11px;color:var(--sub);margin-top:-9px;margin-bottom:12px;}
.checkRow{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--sub);margin:14px 0 18px;}
.checkRow input{margin-top:2px;}
.btn{border:none;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;width:100%;}
.btn.primary{background:var(--accent);color:#fff;}
.btn.google{background:var(--card);border:1.5px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
.btn:disabled{opacity:.45;}
.divider{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:12px;margin:16px 0;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
.switchLine{text-align:center;font-size:13px;color:var(--sub);margin-top:16px;}
.switchLine b{color:var(--accent2);cursor:pointer;}
.errText{color:#e5484d;font-size:12px;margin-top:-8px;margin-bottom:10px;font-weight:600;}
.modalOverlay{position:fixed;inset:0;background:rgba(10,10,20,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.modalCard{background:var(--card);border-radius:18px;padding:22px;max-width:380px;width:100%;box-shadow:var(--shadow);animation:rise .2s ease both;}
.gAccount{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;}
.gAccount:hover{background:var(--bg);}
.gAvatar{width:36px;height:36px;border-radius:50%;background:#4285F4;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;}
.welcomeScreen{text-align:center;}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-8deg);}to{opacity:1;transform:scale(1) rotate(0);}}
@keyframes floatBounce{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-12px) rotate(1deg);}}
.backBtn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-weight:700;font-size:13px;margin-bottom:16px;padding:4px 0;}
.backBtn:hover{color:var(--ink);}
.stepDots{display:flex;justify-content:center;gap:6px;margin-bottom:18px;}
.stepDots span{width:7px;height:7px;border-radius:50%;background:var(--line);}
.stepDots span.on{background:var(--accent);width:20px;border-radius:4px;}

.grid5{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;}
.langCard{cursor:pointer;border-radius:16px;padding:18px 10px;text-align:center;background:var(--card);border:2px solid var(--line);transition:.15s;flex:0 1 140px;}
.langCard:hover{transform:translateY(-3px);}
.langCard:active{transform:scale(.96);}
.langCard.sel{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, var(--card));}
.langCard .flag{font-size:38px;}
.langCard .name{font-weight:700;margin-top:8px;font-size:14px;}
.langCard .speakers{font-size:11px;color:var(--sub);margin-top:2px;}

.levelGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px;}
.levelCard{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--card);text-align:left;}
.levelCard .lic{font-size:22px;flex:none;}
.levelCard b{display:block;font-size:14px;}
.levelCard p{margin:0;font-size:11px;color:var(--sub);line-height:1.3;}
.levelCard.sel{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, var(--card));}
.levelCard{transition:transform .15s ease;}
.levelCard:active{transform:scale(.96);}
@media (max-width:340px){.levelGrid{grid-template-columns:1fr;}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;}
.brand{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:800;font-size:20px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
.stat{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:var(--shadow);}
.avatarWrap{position:relative;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.avatarMenu{position:absolute;right:0;top:42px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;width:180px;z-index:20;animation:rise .15s ease both;}
.avatarMenu .amName{font-weight:700;font-size:13px;padding:8px 10px 4px;color:var(--sub);}
.avatarMenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;padding:9px 10px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink);}
.avatarMenu button:hover{background:var(--bg);}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid var(--line);}
.mascotRow{display:flex;align-items:center;gap:12px;}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:2px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.spk{background:none;border:none;font-size:16px;flex:none;}
.heroBar{position:relative;overflow:hidden;border-radius:18px;padding:18px;margin-bottom:16px;color:#fff;background:linear-gradient(120deg,var(--accent),var(--accent2));display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);}
.heroBar::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.22) 48%,transparent 62%);animation:shimmer 4s ease-in-out infinite;pointer-events:none;}
@keyframes shimmer{0%{transform:translateX(-70%);}100%{transform:translateX(70%);}}
.heroBar .hIcons{font-size:26px;letter-spacing:2px;position:relative;}
.heroBar .hFact{font-size:12.5px;opacity:.95;font-weight:600;line-height:1.4;position:relative;}

.progStrip{display:flex;gap:10px;margin-bottom:16px;}
.psChip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);}
.psChip .psIc{font-size:20px;display:block;margin-bottom:2px;}
.psChip b{display:block;font-size:17px;font-family:'Baloo 2',sans-serif;}
.psChip span{display:block;font-size:10.5px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

.path{position:relative;display:flex;flex-direction:column;gap:12px;margin-top:14px;}
.node{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;border-radius:18px;border:1.5px solid var(--line);background:var(--bg);overflow:hidden;}
.node:not(.locked):active{transform:scale(.97);}
.node.done{background:linear-gradient(120deg, color-mix(in srgb, var(--accent) 18%, var(--card)), color-mix(in srgb, var(--accent) 4%, var(--card)));border-color:color-mix(in srgb, var(--accent) 40%, var(--line));}
.node.active{background:linear-gradient(120deg, color-mix(in srgb, var(--accent2) 22%, var(--card)), color-mix(in srgb, var(--accent2) 5%, var(--card)));border-color:color-mix(in srgb, var(--accent2) 50%, var(--line));box-shadow:var(--shadow);}
.node.locked{opacity:.65;}
.node .circ{width:56px;height:56px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;background:var(--line);z-index:1;box-shadow:0 4px 0 rgba(0,0,0,.08);}
.node.done .circ{background:var(--accent);}
.node.active .circ{background:var(--accent2);animation:pulse 1.8s infinite;}
.node.locked .circ{background:var(--line);color:var(--sub);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent2) 45%, transparent);}50%{box-shadow:0 0 0 8px transparent;}}
.node .txt{flex:1;min-width:0;}
.node .txt b{display:block;font-size:15.5px;}
.node .txt span{font-size:12px;color:var(--sub);}
.node.locked .txt{color:var(--sub);}
.nodeArrow{flex:none;font-size:16px;color:var(--accent2);}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;}
.tab{flex:none;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-weight:700;color:var(--sub);font-size:14px;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

.lessonPanel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:20px;padding:30px 20px;text-align:center;}
.lessonPanel .licon{font-size:28px;margin-bottom:8px;}
.lessonPanel .ltr{font-size:24px;font-weight:800;font-family:'Baloo 2';line-height:1.35;}
.lessonPanel .lpron{opacity:.9;font-size:13px;margin-top:4px;}
.lessonPanel .len{opacity:.85;font-size:13px;margin-top:12px;font-style:italic;}
.audioBtn{margin-top:14px;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;padding:8px 18px;font-weight:700;font-size:13px;}
.rowBtns{display:flex;gap:10px;margin-top:14px;}
.btn.secondary{background:var(--accent2);color:#fff;}
.qOptions{display:grid;gap:10px;margin-top:14px;}
.qOpt{padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:600;text-align:left;font-size:14.5px;width:100%;}
.qOpt.correct{border-color:#16a34a;background:rgba(22,163,74,.16);color:#15803d;}
.qOpt.wrong{border-color:#e5484d;background:rgba(229,72,77,.16);color:#c11c22;}
.qHead{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.matchGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.matchTile{aspect-ratio:1.3;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;text-align:center;padding:6px;cursor:pointer;}
.matchTile.done{opacity:0;pointer-events:none;}
.matchTile.picked{outline:3px solid var(--gold);}
.xpbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;}
.xpbar>i{display:block;height:100%;background:var(--accent);transition:width .4s;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--line);}
.cal div.on{background:var(--accent);}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
.kv b{color:var(--sub);font-weight:600;font-size:12px;text-transform:uppercase;}
footer.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:10;}
footer.tabbar button{background:none;border:none;color:var(--sub);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;}
footer.tabbar button.active{color:var(--accent);}
footer.tabbar button span.ic{font-size:20px;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:600;font-size:14px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:88%;text-align:center;}
.toast.show{opacity:1;transform:translate(-50%,-6px);}
canvas{max-width:100%;}
.mascotResult{margin:10px auto;width:90px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both, floatBounce 2.4s ease-in-out .5s infinite;}

/* ---- splash redesign ---- */
.splashScreen{max-width:480px;}
.splashHero{position:relative;text-align:center;background:linear-gradient(150deg,color-mix(in srgb, var(--accent) 16%, var(--bg)),color-mix(in srgb, var(--accent2) 14%, var(--bg)));border-radius:26px;padding:34px 20px 26px;margin-bottom:18px;overflow:hidden;z-index:0;}
.heroGlow{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:220px;height:220px;background:radial-gradient(circle,color-mix(in srgb, var(--accent) 35%, transparent),transparent 70%);pointer-events:none;}
.splashHero h1{position:relative;font-size:30px;margin-top:10px;}
.splashHero .motto{position:relative;}
.featChips{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;}
.featChips .chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:700;box-shadow:var(--shadow);}

/* ---- registration compact grid ---- */
.fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fieldGrid .field{margin-bottom:10px;}
@media (max-width:380px){.fieldGrid{grid-template-columns:1fr;}}

/* ---- section header (replaces duplicate top tabs) ---- */
.sectionHead{margin:2px 2px 14px;}
.sectionHead h2{font-size:19px;}
.sectionHead p{margin:2px 0 0;font-size:13px;color:var(--sub);}

/* ---- welcome screen staged animation ---- */
.mascotStage{position:relative;display:flex;justify-content:center;margin-bottom:4px;}
.mascotBig{opacity:0;transform:scale(.3) rotate(-12deg);cursor:pointer;}
.mascotBig.pop{animation:popIn .7s cubic-bezier(.34,1.56,.64,1) forwards, floatBounce 2.6s ease-in-out .7s infinite;}
.mascotEyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s ease-in-out infinite;}
@keyframes blink{0%,88%,100%{transform:scaleY(1);}92%,96%{transform:scaleY(.12);}}
@keyframes boop{0%{transform:scale(1) rotate(0);}30%{transform:scale(1.16,.86) rotate(-7deg);}55%{transform:scale(.9,1.12) rotate(5deg);}80%{transform:scale(1.05,.97) rotate(-2deg);}100%{transform:scale(1) rotate(0);}}
.sparkles{position:absolute;inset:0;pointer-events:none;}
.sparkles span{position:absolute;top:50%;left:50%;font-size:20px;opacity:0;}
.sparkles.burst span{animation:sparkleOut 1.1s ease-out forwards;}
@keyframes sparkleOut{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}25%{opacity:1;}100%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(1);}}
.welcomeText{opacity:0;transform:translateY(10px);transition:opacity .6s ease, transform .6s ease;}
.welcomeText.show{opacity:1;transform:translateY(0);}

/* ---- ring chart ---- */
.ringWrap{display:flex;justify-content:center;}

/* ---- chat-style lesson reveal ---- */
.chatThread{display:flex;flex-direction:column;gap:12px;max-height:360px;overflow-y:auto;padding:6px 4px 4px;margin-top:10px;scroll-behavior:smooth;}
.chatMsg{display:flex;gap:9px;align-items:flex-start;animation:rise .35s ease both;}
.chatAvatar{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.chatBubble{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:16px;border-top-left-radius:4px;padding:12px 14px;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;box-shadow:0 3px 10px rgba(20,20,40,.10);}
.chatBubble:active{transform:scale(.98);}
.chatFront b{display:block;font-size:16px;font-family:'Baloo 2',sans-serif;line-height:1.3;}
.chatPron{display:block;font-size:12px;opacity:.88;margin-top:3px;font-style:italic;}
.tapHint{display:block;font-size:10px;opacity:.85;margin-top:7px;letter-spacing:.02em;}
.chatBubble.flipped{background:var(--card);color:var(--ink);border:1.5px solid var(--accent);}
.chatBubble.flipped .tapHint{color:var(--sub);opacity:1;}
.chatBack{display:none;}
.chatBubble.flipped .chatFront{display:none;}
.chatBubble.flipped .chatBack{display:block;}
.chatBackLabel{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:700;margin-bottom:2px;}
.chatBack b{display:block;font-size:14.5px;font-style:italic;color:var(--ink);}

/* ---- quiz analysis ---- */
.analysisList{display:flex;flex-direction:column;gap:8px;margin:14px 0;text-align:left;}
.aRow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);}
.aRow.bad{border-color:color-mix(in srgb, #e5484d 45%, var(--line));}
.aRow.ok{border-color:color-mix(in srgb, #16a34a 45%, var(--line));}
.aIc{font-size:15px;flex:none;margin-top:1px;}
.aBody b{display:block;font-size:13.5px;}
.aBody span{font-size:12px;color:var(--sub);}

/* ---- per-module game badge ---- */
.gameTag{display:inline-block;margin-top:3px;font-size:10px;font-weight:700;color:var(--accent2);background:color-mix(in srgb, var(--accent2) 14%, var(--card));padding:2px 8px;border-radius:10px;letter-spacing:.02em;}

/* ---- sentence builder game ---- */
.builtRow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:46px;margin-top:14px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;transition:.2s;}
.builtRow.ok{border-color:#16a34a;border-style:solid;background:rgba(22,163,74,.08);}
.builtRow.bad{border-color:#e5484d;border-style:solid;background:rgba(229,72,77,.08);}
.chipPlaceholder{color:var(--sub);font-size:12.5px;}
.bankRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.chip{border-radius:10px;padding:9px 13px;font-weight:700;font-size:14.5px;border:none;font-family:'Baloo 2',sans-serif;}
.chip.bank{background:var(--card);border:2px solid var(--line);color:var(--ink);}
.chip.bank:active{transform:scale(.94);}
.chip.built{background:var(--accent);color:#fff;}
.chip.built:active{transform:scale(.94);}
.chip:disabled{opacity:.7;}

/* ---- listening challenge ---- */
.listenPlayBtn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:22px;padding:16px 26px;font-weight:800;font-size:15px;box-shadow:var(--shadow);}
.listenPlayBtn:active{transform:scale(.96);}

/* ---- speed match timer ---- */
.smHead{display:flex;gap:8px;margin:10px 0 4px;}
.smHead .stat{margin:0;}
.smHead .stat.warn{color:#c11c22;border-color:#e5484d;}

/* ---- mascot parts + reactions ---- */
.mascot{transition:transform .25s ease;overflow:visible;}
.mPupils{transition:transform .12s ease-out;}
.mWingL,.mWingR{transform-box:fill-box;transform-origin:50% 8%;}
.mascotBig.waving .mWingR{animation:wingUpR .45s ease-in-out infinite alternate;}
.mascotBig.waving .mWingL{animation:wingUpL .45s ease-in-out .2s infinite alternate;}
@keyframes wingUpR{from{transform:rotate(0);}to{transform:rotate(-55deg);}}
@keyframes wingUpL{from{transform:rotate(0);}to{transform:rotate(55deg);}}
.mReact{display:inline-block;transform-origin:50% 90%;}
.mReact.act-jump{animation:actJump .8s cubic-bezier(.3,1.4,.5,1);}
.mReact.act-spin{animation:actSpin .8s ease-in-out;}
.mReact.act-wiggle{animation:actWiggle .7s ease-in-out;}
.mReact.act-flip{animation:actFlip .9s ease-in-out;}
.mReact.act-dizzy{animation:actDizzy 1.1s ease-in-out;}
@keyframes actJump{0%{transform:scale(1,1);}20%{transform:scale(1.15,.8);}50%{transform:translateY(-70px) scale(.92,1.1);}80%{transform:translateY(0) scale(1.12,.86);}100%{transform:scale(1,1);}}
@keyframes actSpin{to{transform:rotate(360deg) scale(1);}}
@keyframes actWiggle{0%,100%{transform:rotate(0);}15%{transform:rotate(-14deg);}35%{transform:rotate(12deg);}55%{transform:rotate(-9deg);}75%{transform:rotate(6deg);}}
@keyframes actFlip{0%{transform:rotateY(0) translateY(0);}50%{transform:rotateY(180deg) translateY(-30px);}100%{transform:rotateY(360deg) translateY(0);}}
@keyframes actDizzy{0%{transform:rotate(0) scale(1);}60%{transform:rotate(720deg) scale(1.15);}80%{transform:rotate(700deg) scale(.95);}100%{transform:rotate(720deg) scale(1);}}
.mascotStage{margin-top:54px;}
.wBubble{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%) scale(.85);background:var(--card);border:1.5px solid var(--accent);color:var(--ink);padding:8px 14px;border-radius:16px;font-weight:700;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;z-index:2;}
.wBubble::after{content:'';position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:var(--card);border-right:1.5px solid var(--accent);border-bottom:1.5px solid var(--accent);transform:translateX(-50%) rotate(45deg);}
.wBubble.show{opacity:1;transform:translate(-50%,-100%) scale(1);}
.fxPart{position:absolute;left:50%;top:50%;font-size:20px;pointer-events:none;animation:fxOut 1s ease-out forwards;z-index:3;}
@keyframes fxOut{0%{opacity:1;transform:translate(-50%,-50%) scale(.4);}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);}}

/* ---- scenic full-page home ---- */
.sceneFx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none;}
body.homeMode .sceneFx{display:block;}
body.homeMode{background:
  radial-gradient(circle at 85% 8%, color-mix(in srgb,var(--gold) 70%,transparent) 0 4.5%, transparent 5%),
  linear-gradient(180deg, color-mix(in srgb,var(--accent2) 42%,var(--bg)) 0%, color-mix(in srgb,var(--accent2) 18%,var(--bg)) 38%, color-mix(in srgb,var(--accent) 30%,var(--bg)) 78%, color-mix(in srgb,var(--accent) 52%,var(--bg)) 100%);
  background-attachment:fixed;}
body.homeMode .bgMotif span{opacity:.34;}
body.homeMode .topbar{background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:0 0 16px 16px;}
.cloud{position:absolute;font-size:64px;opacity:.75;animation:cloudDrift linear infinite;}
.cloud.c1{top:12%;font-size:70px;animation-duration:60s;}
.cloud.c2{top:34%;font-size:48px;animation-duration:85s;animation-delay:-30s;}
.cloud.c3{top:58%;font-size:58px;animation-duration:70s;animation-delay:-50s;}
@keyframes cloudDrift{from{transform:translateX(-120px);}to{transform:translateX(calc(100vw + 120px));}}
.hill{position:absolute;left:-10%;width:120%;border-radius:50% 50% 0 0;}
.hill.h1{bottom:-90px;height:190px;background:color-mix(in srgb,var(--accent) 38%,transparent);}
.hill.h2{bottom:-120px;left:-40%;width:110%;height:200px;background:color-mix(in srgb,var(--accent2) 30%,transparent);}
.lvlStrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:8px;}
.lvlStrip b{font-size:13.5px;}
.lvlStrip .xpbar{flex:1;min-width:90px;}
.lvlStrip span{font-size:12px;font-weight:700;color:var(--sub);}
.mapScene{position:relative;width:100%;margin-bottom:24px;}
.mapPath{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.mapPath path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;}
.mapPath .pBase{stroke:color-mix(in srgb,var(--card) 85%,transparent);stroke-width:9;stroke-dasharray:1 16;}
.mapPath .pDone{stroke:var(--accent);stroke-width:9;}
.mapNode{position:absolute;transform:translate(-50%,-50%);width:0;height:0;cursor:pointer;}
.mapCirc{position:absolute;left:-40px;top:-40px;width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;background:var(--line);border:5px solid var(--card);box-shadow:0 8px 0 rgba(0,0,0,.10),0 12px 24px rgba(20,20,40,.18);transition:transform .15s ease;}
.mapNode:not(.locked):hover .mapCirc{transform:translateY(-4px) scale(1.05);}
.mapNode:not(.locked):active .mapCirc{transform:scale(.94);}
.mapNode.done .mapCirc{background:var(--accent);}
.mapNode.active .mapCirc{background:var(--accent2);animation:pulse 1.8s infinite;}
.mapNode.locked .mapCirc{background:color-mix(in srgb,var(--card) 70%,var(--line));color:var(--sub);filter:saturate(.35);}
.mapNode.goal .mapCirc{font-size:38px;}
.mapNode.goal.done .mapCirc{background:var(--gold);}
.lockBadge,.starBadge{position:absolute;right:-8px;top:-6px;font-size:18px;filter:none;}
.mapLabel{position:absolute;left:50%;top:50px;transform:translateX(-50%);min-width:130px;max-width:190px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;box-shadow:var(--shadow);}
.mapLabel b{display:block;font-size:13.5px;line-height:1.25;}
.mapLabel span{font-size:11px;color:var(--sub);font-weight:600;}
.mapNode.locked .mapLabel{opacity:.85;}
.mapMascot{position:absolute;left:-31px;bottom:44px;width:62px;display:flex;flex-direction:column;align-items:center;animation:floatBounce 2.2s ease-in-out infinite;pointer-events:none;}
.startTag{background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:2px 9px;border-radius:10px;letter-spacing:.06em;margin-top:-2px;box-shadow:0 3px 0 var(--accent-dark);}
.pron{display:block;font-weight:600;font-size:12px;font-style:italic;opacity:.75;margin-top:2px;letter-spacing:.01em;}
.matchTile .pron{font-size:10px;}
.qOpt.correct .pron{color:#15803d;opacity:.9;}.qOpt.wrong .pron{color:#c11c22;opacity:.9;}
.sayBtn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:15px;line-height:1;padding:0;color:var(--ink);transition:transform .12s ease,background .2s;}
.sayBtn:hover{background:color-mix(in srgb,var(--accent2) 14%,var(--card));}
.sayBtn:active{transform:scale(.9);}
.sayBtn.playing{background:var(--accent2);border-color:var(--accent2);animation:pulse 0.9s;}
.sayBtn.onDark{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55);}
.sayBtn.big{width:44px;height:44px;font-size:18px;vertical-align:middle;margin-left:6px;}
.hdrAudio{display:flex;gap:6px;flex:none;}
.optRow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;}
.bubbleTop{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tileSpk{position:absolute;right:4px;top:4px;width:24px;height:24px;font-size:11px;}
.matchTile{position:relative;}
</style>
</head>

function gameForModule(idx){ return GAME_TYPES[idx % GAME_TYPES.length]; }
function splitWords(str, lang){
  const clean = str.replace(/[.,!?¿¡;:"«»""''、，。！？；：]/g,'').trim();
  if(lang==='zh') return Array.from(clean).filter(c=>c.trim().length);
  return clean.split(/\s+/).filter(Boolean);
}
function sayBtn(text, rate, cls){ return `<button type="button" class="sayBtn ${cls||''}" data-say="${encodeURIComponent(text)}" ${rate?`data-rate="${rate}"`:''} aria-label="${rate?'Play slowly':'Play audio'}" title="${rate?'Play slowly':'Play audio'}">${rate?'🐢':'🔊'}</button>`; }
document.addEventListener('click',e=>{
  const b=e.target.closest && e.target.closest('[data-say]'); if(!b) return;
  e.stopPropagation(); e.preventDefault();
  b.classList.add('playing'); setTimeout(()=>b.classList.remove('playing'),900);
  speak(decodeURIComponent(b.dataset.say), S.lang, b.dataset.rate?+b.dataset.rate:undefined);
},true);
function withPron(t,pr){ return pr ? `${t}<small class="pron">${pr}</small>` : t; }
function joinWords(arr, lang){ return lang==='zh' ? arr.join('') : arr.join(' '); }

function speak(text, langKey, rate){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG_CODES[langKey] || 'en-US';
    u.rate = rate || 0.92;
    speechSynthesis.speak(u);
  }catch(e){}
}

function todayStr(){return new Date().toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function toast(msg){const el=document.getElementById('toast');el.textContent="🦉 "+msg;el.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>el.classList.remove('show'),3000);}
function updateStreakOnLoad(){ if(!S.lastActive) return; if(daysBetween(S.lastActive,todayStr())>=2){S.streak=0;store.set('streak',0);toast(pick(MASCOT_LINES.streakLost));} }
function touchToday(){const t=todayStr(); if(S.lastActive===t) return; const gap=S.lastActive?daysBetween(S.lastActive,t):1; S.streak=gap===1?S.streak+1:1; S.lastActive=t; store.set('streak',S.streak);store.set('lastActive',t); toast(pick(MASCOT_LINES.streakUp));}
function addXP(n){S.xp+=n;store.set('xp',S.xp); const h=S.history,t=todayStr(); let d=h.find(x=>x.date===t); if(!d){d={date:t,xp:0,correct:0,total:0};h.push(d);if(h.length>30)h.shift();} d.xp+=n; store.set('history',h);}
function logAnswer(word,ok){const t=todayStr(),h=S.history; let d=h.find(x=>x.date===t); if(!d){d={date:t,xp:0,correct:0,total:0};h.push(d);} d.total++; if(ok)d.correct++; store.set('history',h);
  const box=(S.srs[word]?.box)||0, nb=ok?Math.min(box+1,4):Math.max(box-1,0), iv=[0,1,2,4,7]; const due=new Date();due.setDate(due.getDate()+iv[nb]); S.srs[word]={box:nb,due:due.toISOString().slice(0,10)}; store.set('srs',S.srs);}

let wTaps=0, wLast=0;
function wBubbleSay(t){ const b=document.getElementById('wBubble'); if(!b) return; b.textContent=t; b.classList.add('show'); clearTimeout(window._wBT); window._wBT=setTimeout(()=>b.classList.remove('show'),2800); }
function fxBurst(host, list){
  if(!host) return;
  for(let i=0;i<9;i++){
    const s=document.createElement('span'); s.className='fxPart'; s.textContent=list[i%list.length];
    const a=Math.random()*Math.PI*2, d=60+Math.random()*60;
    s.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px'); s.style.setProperty('--dy',(Math.sin(a)*d-30).toFixed(0)+'px');
    host.appendChild(s); setTimeout(()=>s.remove(),1000);
  }
}
function mascotAct(act){
  const r=document.getElementById('wReact'); if(!r) return;
  r.className='mReact'; void r.offsetWidth; r.classList.add('act-'+act);
  clearTimeout(window._wAT); window._wAT=setTimeout(()=>{ const rr=document.getElementById('wReact'); if(rr) rr.className='mReact'; },1100);
}
function mascotReact(){
  const m=document.getElementById('wMascot'); if(!m || !m.classList.contains('pop')) return;
  wTaps++; wLast=Date.now();
  m.classList.remove('waving');
  const acts=['jump','spin','wiggle','flip'];
  if(wTaps%5===0){ mascotAct('dizzy'); wBubbleSay('Whoa… I\'m dizzy! 😵‍💫 Ready to learn?'); fxBurst(document.getElementById('wStage'),['💫','⭐','😵‍💫']); return; }
  mascotAct(acts[(wTaps-1)%acts.length]);
  wBubbleSay(WELCOME_LINES[(wTaps-1)%WELCOME_LINES.length]);
  fxBurst(document.getElementById('wStage'),['💚','⭐','✨','💛']);
}
function goWelcome(){
  S.screen='welcome'; S.homeAudioPlayed=false; wTaps=0; wLast=Date.now(); render();
  clearTimeout(window._welcomeT1); clearTimeout(window._welcomeT2); clearTimeout(window._welcomeT3); clearInterval(window._wIdle);
  // Character appears 2s after arriving here, then everything just waits for the user to tap "Let's go →".
  window._welcomeT1=setTimeout(()=>{
    const m=document.getElementById('wMascot'); if(m) m.classList.add('pop','waving');
    const sp=document.getElementById('wSparkles'); if(sp) sp.classList.add('burst');

    setTimeout(()=>{ const mm=document.getElementById('wMascot'); if(mm) mm.classList.remove('waving'); },4500);
    wLast=Date.now();
  }, 2000);
  window._welcomeT2=setTimeout(()=>{
    const t=document.getElementById('wText'); if(t) t.classList.add('show');
    speak(greetingFor(S.lang), S.lang);
  }, 2900);

    if(Date.now()-wLast>6000){ wLast=Date.now(); mascotAct('wiggle'); wBubbleSay('Psst… tap me! 👆'); }

}
// every mascot's eyes (and the big one's head) follow the finger / cursor
let _eyeRaf=0;
function trackEyes(x,y){
  document.querySelectorAll('svg.mascot').forEach(svg=>{
    const g=svg.querySelector('.mPupils'); if(!g) return;
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    const cx=r.left+r.width/2, cy=r.top+r.height*0.3;
    const dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy)||1, k=Math.min(1,d/180);
    g.style.transform='translate('+(dx/d*2.8*k).toFixed(2)+'px,'+(dy/d*2.3*k).toFixed(2)+'px)';
    if(r.width>=80) svg.style.transform='rotate('+(dx/d*7*k).toFixed(1)+'deg)';
  });
}
['pointermove','pointerdown'].forEach(ev=>document.addEventListener(ev,e=>{
  if(_eyeRaf) return; _eyeRaf=requestAnimationFrame(()=>{ _eyeRaf=0; trackEyes(e.clientX,e.clientY); });
},{passive:true}));
function bindAuth(){
  const $=id=>document.getElementById(id);
  const bb=document.querySelector('[data-back]'); if(bb) bb.onclick=()=>goBack(bb.dataset.back);
  const openTerms=document.getElementById('openTerms'); if(openTerms) openTerms.onclick=(e)=>{e.preventDefault(); S.showTerms=true; render();};
  const closeTerms=document.getElementById('closeTerms'); if(closeTerms) closeTerms.onclick=()=>{S.showTerms=false; render();};
  const closeGoogle=document.getElementById('closeGoogle'); if(closeGoogle) closeGoogle.onclick=()=>{S.showGoogle=false; S.googleStep='chooser'; S.formErr3=''; render();};
  const gBackChooser=document.getElementById('gBackChooser'); if(gBackChooser) gBackChooser.onclick=()=>{S.googleStep='chooser'; S.formErr3=''; render();};
  const gContinue=document.getElementById('gContinue'); if(gContinue) gContinue.onclick=()=>{
    const email=document.getElementById('gEmail').value.trim(), name=document.getElementById('gName').value.trim();
    S.googleEmail=email; S.googleName=name;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ S.formErr3='Enter a valid email address.'; render(); return; }
    if(name.length<2){ S.formErr3='Enter your name.'; render(); return; }
    const username=(email.split('@')[0]||'user').toLowerCase().replace(/[^a-z0-9_.]/g,'').slice(0,20)||'user';
    const profile={name, username, email:email.toLowerCase(), contact:'—'};
    store.set('profile',profile); store.set('credentials',{email:email.toLowerCase(),username,password:'google-oauth'});
    S.user=profile; if(!S.lang) S.lang=store.get('lang','zh'); if(!S.level) S.level=store.get('level','Beginner');
    S.showGoogle=false; S.googleStep='chooser'; S.googleEmail=''; S.googleName=''; S.formErr3='';
    updateStreakOnLoad(); goWelcome();
  };
  const closeReset=document.getElementById('closeReset'); if(closeReset) closeReset.onclick=()=>{S.showReset=false; S.resetStep='email'; S.formErr2=''; render();};
  const rsFind=document.getElementById('rsFind'); if(rsFind) rsFind.onclick=()=>{
    const em=document.getElementById('rsEmail').value.trim().toLowerCase();
    const creds=store.get('credentials',null);
    if(!em){ S.formErr2='Enter your registered email.'; render(); return; }
    if(!creds || creds.email!==em){ S.formErr2='No account found with that email.'; render(); return; }
    S.resetEmail=em; S.resetStep='newpass'; S.formErr2=''; render();
  };
  const rsSave=document.getElementById('rsSave'); if(rsSave) rsSave.onclick=()=>{
    const p1=document.getElementById('rsPass').value, p2=document.getElementById('rsPass2').value;
    if(p1.length<6){ S.formErr2='Password must be at least 6 characters.'; render(); return; }
    if(p1!==p2){ S.formErr2='Passwords do not match.'; render(); return; }
    const creds=store.get('credentials',null); creds.password=p1; store.set('credentials',creds);
    S.showReset=false; S.resetStep='email'; S.formErr2=''; toast('Password updated — please log in.'); render();
  };
  document.querySelectorAll('[data-gacct]').forEach(el=>el.onclick=()=>{
    const which=el.dataset.gacct;
    if(which==='new'){ S.googleStep='email'; render(); return; }
    S.showGoogle=false;
    let profile=store.get('profile',null);
    if(!profile){ profile={name:'Amruta Nimbalkar', username:'amruta_nimbalkar', email:'amruta.nimbalkar@gmail.com', contact:'—'}; store.set('profile',profile); store.set('credentials',{email:'amruta.nimbalkar@gmail.com',username:'amruta_nimbalkar',password:'google-oauth'}); }
    S.user=profile; if(!S.lang) S.lang=store.get('lang','zh'); if(!S.level) S.level=store.get('level','Beginner');
    S.formErr=''; updateStreakOnLoad(); goWelcome();
  });
  if(S.screen==='splash'){ $('goReg').onclick=()=>goScreen('register'); $('goLogin').onclick=()=>goScreen('login'); }
  if(S.screen==='register'){
    $('regNext').onclick=()=>{
      const name=$('rName').value.trim(), username=$('rUser').value.trim(), email=$('rEmail').value.trim(), contact=$('rContact').value.trim(), pass=$('rPass').value, pass2=$('rPass2').value, agree=$('rAgree').checked;
      S.regDraft={name,username,email,contact,agree};
      if(!name||!username||!email||!contact||!pass||!pass2){ S.formErr='Please fill in every field.'; render(); return; }
      if(name.length<2){ S.formErr='Please enter your full name.'; render(); return; }
      if(!/^[a-zA-Z0-9_.]{3,20}$/.test(username)){ S.formErr='Username must be 3–20 characters (letters, numbers, _ or . only).'; render(); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ S.formErr='Please enter a valid email address.'; render(); return; }
      if(!/^\+?[0-9]{7,15}$/.test(contact.replace(/[\s-]/g,''))){ S.formErr='Please enter a valid contact number (7–15 digits).'; render(); return; }
      if(pass.length<6){ S.formErr='Password must be at least 6 characters.'; render(); return; }
      if(pass!==pass2){ S.formErr='Passwords do not match.'; render(); return; }
      if(!agree){ S.formErr='Please accept the Terms & Privacy Policy.'; render(); return; }
      store.set('profile',{name,username,email,contact});
      store.set('credentials',{email:email.toLowerCase(),username:username.toLowerCase(),password:pass});
      S.lang=null; S.level=null; goScreen('langSelect');
    };
    $('toLogin').onclick=()=>goScreen('login');
  }
  if(S.screen==='langSelect'){
    document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{S.lang=el.dataset.pick; render();});
    $('langNext').onclick=()=>{ store.set('lang',S.lang); goScreen('levelSelect'); };
  }
  if(S.screen==='levelSelect'){
    document.querySelectorAll('[data-level]').forEach(el=>el.onclick=()=>{S.level=el.dataset.level; render();});
    $('levelNext').onclick=()=>{ store.set('level',S.level); goScreen('journey'); };
  }
  if(S.screen==='journey'){ $('toLoginFromJourney').onclick=()=>goScreen('login'); }
  if(S.screen==='login'){
    $('doLogin').onclick=()=>{
      const u=$('lUser').value.trim().toLowerCase(), p=$('lPass').value;
      const creds=store.get('credentials',null);
      if(!u||!p){ S.formErr='Enter your email/username and password.'; render(); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u) && !/^[a-zA-Z0-9_.]{3,20}$/.test(u)){ S.formErr='Enter a valid email or username.'; render(); return; }
      if(!creds){ S.formErr='No account found — please register first.'; render(); return; }
      if((u!==creds.email && u!==creds.username) || p!==creds.password){ S.formErr='Incorrect email/username or password.'; render(); return; }
      S.user=store.get('profile',null); if(!S.lang) S.lang=store.get('lang','zh'); if(!S.level) S.level=store.get('level','Beginner');
      S.formErr=''; updateStreakOnLoad(); goWelcome();
    };
    $('googleLogin').onclick=()=>{ S.showGoogle=true; render(); };
    $('forgotPass').onclick=e=>{ e.preventDefault(); S.showReset=true; S.resetStep='email'; S.resetEmail=''; S.formErr2=''; render(); };
    $('toRegister').onclick=()=>goScreen('register');
  }
  if(S.screen==='welcome'){
    const sw=$('skipWelcome');
    sw.onmouseenter=()=>{ const m=$('wMascot'); if(m && m.classList.contains('pop')){ mascotAct('jump'); wBubbleSay('Yes! Let\'s go! 🚀'); } };
    sw.onclick=()=>{
      const m=$('wMascot');
      if(m && m.classList.contains('pop')){ mascotAct('jump'); wBubbleSay('Let\'s goooo! 🚀'); fxBurst($('wStage'),['🎉','⭐','✨','💚']); setTimeout(leaveWelcome,650); }
      else leaveWelcome();
    };
    const wm=$('wMascot');
    if(wm) wm.onclick=()=>mascotReact();
  }
}

function speedMatchScreen(mod){
  const {tiles,picked,solved,timeLeft,total}=stageCtx;
  return `<div class="card"><h3>${mod.title} · Speed Match</h3>

    <div class="matchGrid">${tiles.map(t=>`<div class="matchTile ${solved.has(t.pair)?'done':''} ${picked.includes(t.id)?'picked':''}" data-smtile="${t.id}">${t.label}</div>`).join('')}</div>
  </div>`;
}
function tickSpeedMatch(){
  if(!stageCtx || stageCtx.game!=='speedmatch' || stageCtx.phase!=='play'){ if(stageTimer){clearInterval(stageTimer); stageTimer=null;} return; }
  stageCtx.timeLeft--;
  if(stageCtx.timeLeft<=0){ finishSpeedMatch(false); return; }
  render();
}
function finishSpeedMatch(passed){
  if(stageTimer){ clearInterval(stageTimer); stageTimer=null; }
  const matched=stageCtx.solved.size, total=stageCtx.total;
  completeStage(passed, [], matched, total);
}

function startStage(idx){
  if(stageTimer){ clearInterval(stageTimer); stageTimer=null; }
  const mod=levelModules()[idx]; const game=gameForModule(idx); const pool=allItems();
  if(game==='chat'){
    const deck=mod.items.map(itemTuple);
    const quiz=mod.items.map(it=>{
      const correct=itemTuple(it); let opts=[correct];
      while(opts.length<4){const c=itemTuple(pick(pool)); if(!opts.some(o=>o[1]===c[1])) opts.push(c);}
      opts.sort(()=>Math.random()-.5); return {correct,opts,answered:false,chosen:null};
    });
    stageCtx={idx,game,phase:'cards',deck,pos:0,quiz,qpos:0,correctCount:0,revealed:new Set()};
  } else if(game==='builder'){
    stageCtx={idx,game,phase:'play',items:mod.items.map(itemTuple),pos:0,correctCount:0,itemResults:[],bank:[],built:[],checked:false,correctFlag:null};
    setupBuilderPos();
  } else if(game==='listen'){
    const quiz=mod.items.map(it=>{
      const correct=itemTuple(it); let opts=[correct];
      while(opts.length<4){const c=itemTuple(pick(pool)); if(!opts.some(o=>o[0]===c[0])) opts.push(c);}
      opts.sort(()=>Math.random()-.5); return {correct,opts,answered:false,chosen:null,played:false};
    });
    stageCtx={idx,game,phase:'play',quiz,qpos:0,correctCount:0};
  } else if(game==='speedmatch'){
    const pairs=mod.items.map(itemTuple);
    let tiles=[]; pairs.forEach((p,i)=>{ tiles.push({id:'a'+i,label:p[0],pair:i}); tiles.push({id:'b'+i,label:withPron(p[1],p[2])+sayBtn(p[1],null,'tileSpk'),pair:i}); });
    tiles.sort(()=>Math.random()-.5);
    stageCtx={idx,game,phase:'play',tiles,picked:[],solved:new Set(),total:pairs.length,timeLeft:Math.max(30,pairs.length*12)};
    stageTimer=setInterval(tickSpeedMatch,1000);
  }
  render();
}
function statsScreen(){

  return `<div class="card"><h3>Progress</h3>

    render();
  });
  const bbt=document.querySelector('[data-back-tab]'); if(bbt) bbt.onclick=()=>{S.tab=bbt.dataset.backTab; render();};

  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{

    render();

  if(S.tab==='home' && !stageCtx){
    document.querySelectorAll('[data-stage]').forEach(el=>el.onclick=()=>{
      const i=+el.dataset.stage; if(i>langProgress()){ toast('Clear the previous module to unlock this one 🔒'); return; } startStage(i);

    const fr=document.getElementById('finishResult'); if(fr) fr.onclick=()=>{ stageCtx=null; render(); };
  }

    if(stageCtx.phase==='cards'){
      const th=document.getElementById('chatThread'); if(th) th.scrollTop=th.scrollHeight;
      document.querySelectorAll('[data-msg]').forEach(el=>el.onclick=()=>{
        const i=+el.dataset.msg;
        if(stageCtx.revealed.has(i)){ stageCtx.revealed.delete(i); }
        else { stageCtx.revealed.add(i); speak(stageCtx.deck[i][1], S.lang); }

      const cn=document.getElementById('cardNext'); if(cn) cn.onclick=()=>{
        if(stageCtx.pos+1<stageCtx.deck.length){stageCtx.pos++;} else {stageCtx.phase='quiz';}
        render();
      };
    } else {
      const q=stageCtx.quiz[stageCtx.qpos];
      const qs=document.getElementById('qSpk'); if(qs) qs.onclick=()=>speak(q.correct[1], S.lang);
      const qp=document.getElementById('quizPrev'); if(qp) qp.onclick=()=>{ if(stageCtx.qpos>0){stageCtx.qpos--; render();} };
      document.querySelectorAll('[data-opt]').forEach(btn=>btn.onclick=()=>{
        if(q.answered) return;
        const chosen=q.opts[+btn.dataset.opt]; q.chosen=chosen; q.answered=true;
        const ok=chosen===q.correct; if(ok) stageCtx.correctCount++;
        logAnswer(q.correct[0], ok);
        speak(q.correct[1], S.lang);
        render();
      });
      const qn=document.getElementById('quizNext');
      if(qn) qn.onclick=()=>{
        if(stageCtx.qpos+1<stageCtx.quiz.length){ stageCtx.qpos++; render(); return; }
        const passed = stageCtx.correctCount >= Math.ceil(stageCtx.quiz.length/2);
        const rows = stageCtx.quiz.map(q2=>{
          const ok=q2.chosen && q2.chosen[1]===q2.correct[1];
          return {label:q2.correct[0], detail:`${LANGS[S.lang].name}: ${q2.correct[1]}${q2.correct[2]?' ('+q2.correct[2]+')':''}${!ok && q2.chosen?` — you picked "${q2.chosen[1]}"`:''}`, ok, say:q2.correct[1]};
        });
        completeStage(passed, rows, stageCtx.correctCount, stageCtx.quiz.length);
      };
    }
  }
  if(S.tab==='home' && stageCtx && stageCtx.game==='builder' && stageCtx.phase==='play'){
    if(!stageCtx.checked){
      document.querySelectorAll('[data-bank]').forEach(el=>el.onclick=()=>{
        const id=el.dataset.bank; const i=stageCtx.bank.findIndex(b=>b.id===id); if(i<0) return;
        const [chip]=stageCtx.bank.splice(i,1); stageCtx.built.push(chip); render();
      });
      document.querySelectorAll('[data-built]').forEach(el=>el.onclick=()=>{
        const id=el.dataset.built; const i=stageCtx.built.findIndex(b=>b.id===id); if(i<0) return;
        const [chip]=stageCtx.built.splice(i,1); stageCtx.bank.push(chip); render();
      });
      const bc=document.getElementById('builderClear'); if(bc) bc.onclick=()=>{ stageCtx.bank.push(...stageCtx.built); stageCtx.built=[]; render(); };
      const bch=document.getElementById('builderCheck'); if(bch) bch.onclick=()=>{
        const it=stageCtx.items[stageCtx.pos];
        const key=joinWords(splitWords(it[1],S.lang),S.lang).toLowerCase();
        const attempt=joinWords(stageCtx.built.map(b=>b.text),S.lang).toLowerCase();
        const ok = attempt===key;
        stageCtx.checked=true; stageCtx.correctFlag=ok; if(ok) stageCtx.correctCount++;
        stageCtx.itemResults.push({label:it[0], detail:`${LANGS[S.lang].name}: ${it[1]}${it[2]?' ('+it[2]+')':''}`, ok, say:it[1]});
        logAnswer(it[0], ok);
        speak(it[1], S.lang);
        render();
      };
    } else {
      const bn=document.getElementById('builderNext'); if(bn) bn.onclick=()=>{
        if(stageCtx.pos+1<stageCtx.items.length){ stageCtx.pos++; setupBuilderPos(); render(); }
        else {
          const passed = stageCtx.correctCount>=Math.ceil(stageCtx.items.length/2);
          completeStage(passed, stageCtx.itemResults, stageCtx.correctCount, stageCtx.items.length);
        }
      };
    }
  }
  if(S.tab==='home' && stageCtx && stageCtx.game==='listen' && stageCtx.phase==='play'){
    const q=stageCtx.quiz[stageCtx.qpos];
    if(!q.played){ q.played=true; setTimeout(()=>speak(q.correct[1], S.lang), 300); }
    const lp=document.getElementById('listenPlay'); if(lp) lp.onclick=()=>speak(q.correct[1], S.lang);
    document.querySelectorAll('[data-lopt]').forEach(btn=>btn.onclick=()=>{
      if(q.answered) return;
      const chosen=q.opts[+btn.dataset.lopt]; q.chosen=chosen; q.answered=true;
      const ok=chosen[0]===q.correct[0]; if(ok) stageCtx.correctCount++;
      logAnswer(q.correct[0], ok);
      render();
    });
    const ln=document.getElementById('listenNext'); if(ln) ln.onclick=()=>{
      if(stageCtx.qpos+1<stageCtx.quiz.length){ stageCtx.qpos++; render(); return; }
      const passed=stageCtx.correctCount>=Math.ceil(stageCtx.quiz.length/2);
      const rows=stageCtx.quiz.map(q2=>{
        const ok = q2.chosen && q2.chosen[0]===q2.correct[0];
        return {label:withPron(q2.correct[1],q2.correct[2]), detail:`means "${q2.correct[0]}"${!ok && q2.chosen?` — you picked "${q2.chosen[0]}"`:''}`, ok, say:q2.correct[1]};
      });
      completeStage(passed, rows, stageCtx.correctCount, stageCtx.quiz.length);
    };
  }
  if(S.tab==='home' && stageCtx && stageCtx.game==='speedmatch' && stageCtx.phase==='play'){
    document.querySelectorAll('[data-smtile]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.smtile; if(stageCtx.picked.includes(id)) return;
      const tile=stageCtx.tiles.find(t=>t.id===id); if(!tile || stageCtx.solved.has(tile.pair)) return;
      stageCtx.picked.push(id);
      if(stageCtx.picked.length===2){
        const [id1,id2]=stageCtx.picked, t1=stageCtx.tiles.find(t=>t.id===id1), t2=stageCtx.tiles.find(t=>t.id===id2);
        if(t1.pair===t2.pair){
          stageCtx.solved.add(t1.pair); stageCtx.picked=[];
          if(stageCtx.solved.size===stageCtx.total){ finishSpeedMatch(true); return; }
        } else { setTimeout(()=>{ if(stageCtx && stageCtx.game==='speedmatch'){stageCtx.picked=[]; render();} },500); }
      }
      render();
    });
  }
  if(S.tab==='match'){
    document.querySelectorAll('[data-tile]').forEach(el=>el.onclick=()=>{
      const id=el.dataset.tile; if(matchState.picked.includes(id)) return;
      matchState.picked.push(id);
      if(matchState.picked.length===2){
        const [id1,id2]=matchState.picked, t1=matchState.tiles.find(t=>t.id===id1), t2=matchState.tiles.find(t=>t.id===id2);
        if(t1.pair===t2.pair){ matchState.solved.add(t1.pair); matchState.picked=[]; addXP(6); touchToday();
          if(matchState.solved.size===matchState.tiles.length/2){ toast('Board cleared! +bonus XP'); addXP(10); } }
        else { setTimeout(()=>{matchState.picked=[]; render();},550); }
      }
      render();
    });
    const rb=document.getElementById('resetMatch'); if(rb) rb.onclick=()=>{newMatch(); render();};
  }
  if(S.tab==='stats'){
    const ctx=document.getElementById('xpChart');
    if(ctx && window.Chart){
      const last=S.history.slice(-7);
      new Chart(ctx,{type:'line',data:{labels:last.map(d=>d.date.slice(5)),datasets:[{label:'XP',data:last.map(d=>d.xp),borderColor:getComputedStyle(document.documentElement).getPropertyValue('--accent'),tension:.3,fill:false}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
    }
    const nb=document.getElementById('notifBtn');
    if(nb) nb.onclick=async()=>{
      if(!('Notification' in window)){toast('Notifications not supported in this browser.'); return;}
      const perm=await Notification.requestPermission();
      if(perm==='granted'){ toast('Reminders on! (demo notification below)'); setTimeout(()=>{try{new Notification('FluentFlow 🦉',{body:pick(MASCOT_LINES.idle)});}catch(e){}},1500); }
      else toast('Notifications blocked — enable them in browser settings.');
    };
  }
  if(S.tab==='langSwitch'){
    document.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{S.lang=el.dataset.pick; render();});
    const btn=document.getElementById('langNext');
    if(btn) btn.onclick=()=>{ store.set('lang',S.lang); S.tab='home'; render(); };
  }
}

render();
</script>
</body>
</html>
